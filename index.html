<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GVA Planning</title>
  <link rel="stylesheet" href="styles.css?v=20260915-2">
</head>
<body>
<header class="app-header">
  <div>
    <h1>GVA Planning</h1>
    <p>Planificació de tasques del GVA Agile Board</p>
  </div>
</header>

<main>
  <section class="controls">
    <label class="file-control">
      <span>Carregar HTML local</span>
      <input id="fileInput" type="file" accept=".html,.htm,text/html">
    </label>
    <button id="extensionBtn" type="button">Esperar dades de l'extensió</button>
    <button id="csvBtn" type="button" disabled>Descarregar CSV</button>
  </section>

  <div id="status" class="status">Esperant dades…</div>

  <section id="summary" class="summary" hidden>
    <div><strong id="taskCount">0</strong><span>tasques</span></div>
    <div><strong id="peopleCount">0</strong><span>persones</span></div>
    <div><strong id="wordCount">0</strong><span>paraules</span></div>
  </section>

  <section id="planner" class="planner" hidden>
    <div class="gantt-scroll">
      <div id="gantt"></div>
    </div>
  </section>
</main>

<script src="app.js?v=20260915-2"></script>
</body>
</html>
